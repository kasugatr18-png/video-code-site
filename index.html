<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>特典動画視聴ページ</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f9f9f9;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            width: 400px;
        }
        input[type="text"] {
            width: 250px;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-right: 5px;
        }
        button {
            padding: 10px 15px;
            font-size: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error-msg {
            color: red;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 動画1用 -->
    <div class="container">
        <h2>動画 1</h2>
        <input type="text" id="code-input-1">
        <button onclick="verifyCode('video1', 'code-input-1', 'error-msg-1')">送信</button>
        <div id="error-msg-1" class="error-msg"></div>
    </div>

    <br>

    <!-- 動画2用 -->
    <div class="container">
        <h2>動画 2</h2>
        <input type="text" id="code-input-2">
        <button onclick="verifyCode('video2', 'code-input-2', 'error-msg-2')">送信</button>
        <div id="error-msg-2" class="error-msg"></div>
    </div>

    <br>

    <!-- 動画3用 -->
    <div class="container">
        <h2>動画 3</h2>
        <input type="text" id="code-input-3">
        <button onclick="verifyCode('video3', 'code-input-3', 'error-msg-3')">送信</button>
        <div id="error-msg-3" class="error-msg"></div>
    </div>

<script>
    const GAS_URL = "YOUR_GAS_WEB_APP_URL"; // ご自身のGASのURLに書き換えてください

    async function verifyCode(videoType, inputId, errorId) {
        const codeInput = document.getElementById(inputId).value.trim();
        const errorMsg = document.getElementById(errorId);
        errorMsg.textContent = "";

        errorMsg.style.color = "blue";
        errorMsg.textContent = "確認中...";

        try {
            const requestUrl = `${GAS_URL}?code=${encodeURIComponent(codeInput)}&videoType=${videoType}`;
            console.log("リクエスト送信先:", requestUrl);

            const response = await fetch(requestUrl);
            const textResponse = await response.text();
            console.log("GASからの生レスポンス:", textResponse);

            const result = JSON.parse(textResponse);

            if (result.success) {
                alert("コードが確認されました！動画ページへ移動します。");
                window.location.href = result.url;
            } else {
                errorMsg.style.color = "red";
                errorMsg.textContent = result.message;
            }
        } catch (err) {
            console.error("詳細エラー:", err);
            errorMsg.style.color = "red";
            errorMsg.textContent = "無効なコードです。";
        }
    }
</script>

</body>
</html>
